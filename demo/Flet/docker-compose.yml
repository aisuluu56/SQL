services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flet_student}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Сначала создайте .env из .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-flet_academy}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - flet_academy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flet_academy_pgdata:
